[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-food-sim"
version = "0.1.0"
description = "An assumption-driven discrete-event campus food pickup simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "simpy",
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
campus-food-sim = "campus_food_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
